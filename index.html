<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPRITE.3D · 179款原创高辨识度3D精灵图鉴</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
            onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="min-h-screen flex flex-col relative bg-[#f4f4f7]">

    <canvas id="webgl-canvas"></canvas>

    <!-- 顶部栏 (极致纯粹、克制优雅，舒适大气高度与精致间距) -->
    <header class="sticky top-0 z-30 w-full bg-[hsla(0,0%,100%,0.85)] backdrop-blur-xl border-b border-[hsla(0,0%,0%,0.05)] shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
        <div class="max-w-[1560px] mx-auto h-[68px] px-6 sm:px-10 flex items-center justify-between gap-6">

            <!-- 左：纯粹高阶字标 (优雅对齐与舒适比例) -->
            <div class="flex items-center gap-2.5 select-none shrink-0 cursor-default">
                <span class="text-[19px] font-bold tracking-tight text-[#18181b]">Sprite 3D</span>
                <span class="text-xs font-mono font-medium text-[#71717a] bg-[#f0f0f3] px-2.5 py-0.5 rounded-full">179</span>
            </div>

            <!-- 中：居中极简透亮搜索栏 (宽裕舒适的 40px 胶囊输入框) -->
            <div class="relative flex items-center flex-1 max-w-[460px] mx-auto">
                <svg class="w-4 h-4 text-[#9ca3af] absolute left-4 pointer-events-none" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0z"/>
                </svg>
                <input id="sprite-search-input" type="text" placeholder="搜索 179 款精灵 (名称、英文、编号)..." class="w-full h-10 pl-11 pr-5 rounded-full bg-[#f2f2f5] hover:bg-[#eaebef] focus:bg-white text-[13px] text-[#18181b] placeholder-[#9ca3af] outline-none border border-transparent focus:border-black/5 focus:ring-2 focus:ring-black/5 transition-all shadow-xs">
            </div>

            <!-- 右：GitHub 与 Star 统计 (和背景色完全融为一体，零描边，hover 时柔和微高亮) -->
            <div class="flex items-center justify-end shrink-0 select-none">
                <a href="https://github.com/atobelix/sprite-3d" target="_blank" rel="noopener noreferrer" class="h-9 px-2.5 rounded-lg text-[#71717a] hover:text-[#18181b] hover:bg-black/[0.04] transition-all flex items-center gap-2 cursor-pointer select-none group" title="前往 GitHub 查看项目仓库">
                    <svg class="w-4 h-4 fill-current text-[#71717a] group-hover:text-[#18181b] transition-colors" viewBox="0 0 24 24">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                    <span class="text-xs font-medium text-[#71717a] group-hover:text-[#18181b] transition-colors">GitHub</span>
                    <span class="flex items-center gap-1 text-xs font-mono font-medium text-[#71717a] group-hover:text-[#18181b] transition-colors">
                        <svg class="w-3.5 h-3.5 fill-amber-400 stroke-amber-500 stroke-[1.2]" viewBox="0 0 24 24">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                        <span id="github-star-count">0</span>
                    </span>
                </a>
            </div>
        </div>
    </header>

    <!-- 主展示区 (严格裁决居中边距，两边留出充裕安全带，现代 Bento 风格 8 列清爽呼吸感视野) -->
    <main class="flex-1 max-w-[1560px] mx-auto w-full px-6 sm:px-10 py-7 z-20">

        <!-- 精选多维分类导航栏 (优雅精致的沉浸式分段控件，无全屏割裂线，无杂乱数字) -->
        <div class="mb-6 flex items-center justify-start sm:justify-center overflow-x-auto no-scrollbar select-none">
            <div class="p-1 bg-[#ebebef] rounded-xl flex items-center gap-1 shrink-0" id="category-tabs">
                <button data-cat="all" class="category-tab px-3.5 py-1.5 rounded-lg bg-white text-[#18181b] shadow-xs text-xs font-semibold transition-all cursor-pointer select-none">全部</button>
                <button data-cat="日常器物" class="category-tab px-3.5 py-1.5 rounded-lg hover:bg-white/60 text-[#71717a] hover:text-[#18181b] text-xs font-medium transition-all cursor-pointer select-none">日常器物</button>
                <button data-cat="美味食光" class="category-tab px-3.5 py-1.5 rounded-lg hover:bg-white/60 text-[#71717a] hover:text-[#18181b] text-xs font-medium transition-all cursor-pointer select-none">美味食光</button>
                <button data-cat="自然生灵" class="category-tab px-3.5 py-1.5 rounded-lg hover:bg-white/60 text-[#71717a] hover:text-[#18181b] text-xs font-medium transition-all cursor-pointer select-none">自然生灵</button>
                <button data-cat="潮玩艺术" class="category-tab px-3.5 py-1.5 rounded-lg hover:bg-white/60 text-[#71717a] hover:text-[#18181b] text-xs font-medium transition-all cursor-pointer select-none">潮玩艺术</button>
                <button data-cat="奇幻冒险" class="category-tab px-3.5 py-1.5 rounded-lg hover:bg-white/60 text-[#71717a] hover:text-[#18181b] text-xs font-medium transition-all cursor-pointer select-none">奇幻冒险</button>
                <button data-cat="数智科技" class="category-tab px-3.5 py-1.5 rounded-lg hover:bg-white/60 text-[#71717a] hover:text-[#18181b] text-xs font-medium transition-all cursor-pointer select-none">数智科技</button>
                <button data-cat="职业职能" class="category-tab px-3.5 py-1.5 rounded-lg hover:bg-white/60 text-[#71717a] hover:text-[#18181b] text-xs font-medium transition-all cursor-pointer select-none">职业职能</button>
            </div>
        </div>

        <div id="cloud-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-4.5 sm:gap-5 items-stretch"></div>
    </main>

    <!-- 纯白底详情 / 捏模弹窗 (零描边，极简视觉图形贴图，彻底消除文字混乱) -->
    <div id="sculptor-modal" class="fixed inset-0 z-40 hidden items-center justify-center p-4 sm:p-6 bg-[hsla(0,0%,0%,0.25)] backdrop-blur-xs">
        <div id="sculptor-modal-card" class="bg-white w-full max-w-4xl rounded-3xl overflow-hidden flex flex-col md:flex-row max-h-[92vh] shadow-2xl">

            <!-- 左：3D纯白视口 (无任何边框，支持鼠标滚轮缩放与平移) -->
            <div class="relative w-full md:w-7/12 min-h-[340px] md:min-h-[520px] bg-white flex flex-col justify-between p-6 shrink-0">
                <!-- 顶部精灵信息与视角切换胶囊 (加大标题字号，单行不折行) -->
                <div class="flex items-center justify-between z-50 relative gap-3">
                    <div class="flex items-center gap-2 min-w-0">
                        <span id="sculpt-badge-index" class="text-sm font-mono text-[hsla(0,0%,50%,1)] font-semibold shrink-0">#01</span>
                        <h2 id="sculpt-cloud-title" class="text-base sm:text-lg font-bold text-[hsla(0,0%,12%,1)] tracking-tight whitespace-nowrap truncate">云宝 Nimbus</h2>
                        <span id="sculpt-cloud-category" class="text-[11px] font-medium text-[#71717a] bg-[#f0f0f3] px-2 py-0.5 rounded-full shrink-0">自然生灵</span>
                    </div>
                    <!-- 视口视角快速切换 (整合至顶部，干净整洁) -->
                    <div class="flex items-center gap-1 bg-[hsla(0,0%,96%,1)] rounded-full p-0.5 text-xs shrink-0">
                        <button data-sview="iso" class="sculpt-view-btn h-6 px-2.5 rounded-full bg-[hsla(0,0%,25%,1)] text-white font-medium transition cursor-pointer flex items-center justify-center">斜</button>
                        <button data-sview="front" class="sculpt-view-btn h-6 px-2.5 rounded-full hover:bg-[hsla(0,0%,90%,1)] text-[hsla(0,0%,40%,1)] transition cursor-pointer flex items-center justify-center">正</button>
                        <button data-sview="side" class="sculpt-view-btn h-6 px-2.5 rounded-full hover:bg-[hsla(0,0%,90%,1)] text-[hsla(0,0%,40%,1)] transition cursor-pointer flex items-center justify-center">侧</button>
                        <button data-sview="back" class="sculpt-view-btn h-6 px-2.5 rounded-full hover:bg-[hsla(0,0%,90%,1)] text-[hsla(0,0%,40%,1)] transition cursor-pointer flex items-center justify-center">背</button>
                    </div>
                </div>

                <!-- 3D 渲染槽位 (纯白底色，支持滚轮缩放) -->
                <div id="sculpt-viewport-slot" class="w-full flex-1 my-2 rounded-2xl relative cursor-grab active:cursor-grabbing bg-white"></div>

                <!-- 视口底部操作图标组 (彻底去除汉字文字干扰，纯图标化交互) -->
                <div class="flex items-center justify-between z-50 relative pt-1">
                    <!-- 纯图标重置按钮 (还原初始参数) -->
                    <button id="btn-sculpt-reset" class="w-8 h-8 rounded-full bg-[hsla(0,0%,96%,1)] hover:bg-[hsla(0,0%,90%,1)] text-[hsla(0,0%,35%,1)] hover:text-black transition flex items-center justify-center cursor-pointer shadow-xs" title="还原初始参数">
                        <svg class="w-4 h-4 stroke-current fill-none stroke-[2.2] stroke-linecap-round stroke-linejoin-round" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                    <!-- 纯图标前后翻页胶囊组 (杜绝多余汉字) -->
                    <div class="flex items-center gap-1 bg-[hsla(0,0%,96%,1)] rounded-full p-1 shadow-xs">
                        <button id="btn-prev-cloud" class="w-7 h-7 rounded-full hover:bg-white text-[hsla(0,0%,35%,1)] hover:text-black transition flex items-center justify-center cursor-pointer" title="上一个精灵">
                            <svg class="w-4 h-4 stroke-current fill-none stroke-[2.2] stroke-linecap-round stroke-linejoin-round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                        </button>
                        <button id="btn-next-cloud" class="w-7 h-7 rounded-full hover:bg-white text-[hsla(0,0%,35%,1)] hover:text-black transition flex items-center justify-center cursor-pointer" title="下一个精灵">
                            <svg class="w-4 h-4 stroke-current fill-none stroke-[2.2] stroke-linecap-round stroke-linejoin-round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右：纯白控制面板 (完全无描边，透气分层，极致干净简洁) -->
            <div class="w-full md:w-5/12 flex flex-col bg-white border-l border-[hsla(0,0%,0%,0.04)] max-h-[58vh] md:max-h-none z-50 relative flex-1 min-w-0">
                <!-- 顶部栏 (极致干净，仅留标题与右上角关闭) -->
                <div class="px-6 pt-5 pb-3 flex items-center justify-between shrink-0">
                    <span class="text-xs font-semibold text-[hsla(0,0%,40%,1)] tracking-wide">参数定制</span>
                    <button id="btn-close-sculptor" class="w-7 h-7 rounded-full bg-[hsla(0,0%,96%,1)] hover:bg-[hsla(0,0%,90%,1)] text-[hsla(0,0%,40%,1)] flex items-center justify-center transition cursor-pointer text-xs" title="关闭">✕</button>
                </div>

                <!-- 滚动参数内容 (充足留白，结构清晰，统一 12px Medium 字体) -->
                <div class="px-6 pb-6 overflow-y-auto custom-scroll space-y-4 flex-1">

                    <!-- 形体比例滑块 (2列无描边胶囊) -->
                    <div class="space-y-1.5">
                        <span class="text-xs font-medium text-[hsla(0,0%,50%,1)]">形体比例</span>
                        <div class="grid grid-cols-2 gap-2">
                            <div id="pill-morph-sx" data-label="宽度 X" data-min="0.70" data-max="1.35" data-step="0.02" data-value="1.00"></div>
                            <div id="pill-morph-sy" data-label="高度 Y" data-min="0.70" data-max="1.35" data-step="0.02" data-value="1.00"></div>
                            <div id="pill-morph-sz" data-label="厚度 Z" data-min="0.65" data-max="1.40" data-step="0.02" data-value="1.00"></div>
                            <div id="pill-morph-feat" data-label="细节比例" data-min="0.0" data-max="1.60" data-step="0.05" data-value="1.00"></div>
                        </div>
                    </div>

                    <!-- 眼神表情纯视觉贴图 (无大外框，直接通透平铺 6列小巧圆滑贴图，与3D效果1:1完全对应) -->
                    <div class="space-y-1.5">
                        <span class="text-xs font-medium text-[hsla(0,0%,50%,1)]">表情贴图</span>
                        <div class="grid grid-cols-6 gap-2 pt-0.5">
                            <!-- 1. 经典双竖瞳 normal -->
                            <button data-eye="normal" class="eye-type-btn w-9 h-9 rounded-full bg-[#222226] text-white hover:bg-black transition flex items-center justify-center cursor-pointer p-1.5 hover:scale-105 active:scale-95 shrink-0" title="经典竖瞳">
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><rect x="5.5" y="5" width="4" height="14" rx="2"/><rect x="14.5" y="5" width="4" height="14" rx="2"/></svg>
                            </button>
                            <!-- 2. 微笑双瞳 smile -->
                            <button data-eye="smile" class="eye-type-btn w-9 h-9 rounded-full bg-[#222226] text-white hover:bg-black transition flex items-center justify-center cursor-pointer p-1.5 hover:scale-105 active:scale-95 shrink-0" title="微笑双瞳">
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><rect x="5.5" y="4" width="3.6" height="11" rx="1.8"/><rect x="14.9" y="4" width="3.6" height="11" rx="1.8"/><path class="stroke-current fill-none stroke-[2.2] stroke-linecap-round" d="M8 18c1.8 2 6.2 2 8 0"/></svg>
                            </button>
                            <!-- 3. 元气眯眼 squint (>_<) -->
                            <button data-eye="squint" class="eye-type-btn w-9 h-9 rounded-full bg-[#222226] text-white hover:bg-black transition flex items-center justify-center cursor-pointer p-1.5 hover:scale-105 active:scale-95 shrink-0" title="元气眯眼">
                                <svg class="w-5 h-5 stroke-current fill-none stroke-[2.2] stroke-linecap-round stroke-linejoin-round" viewBox="0 0 24 24"><path d="M9 7L5 11l4 4M15 7l4 4-4 4"/><line x1="10" y1="18.5" x2="14" y2="18.5"/></svg>
                            </button>
                            <!-- 4. 弯月笑眼 happy (^^) -->
                            <button data-eye="happy" class="eye-type-btn w-9 h-9 rounded-full bg-[#222226] text-white hover:bg-black transition flex items-center justify-center cursor-pointer p-1.5 hover:scale-105 active:scale-95 shrink-0" title="弯月笑眼">
                                <svg class="w-5 h-5 stroke-current fill-none stroke-[2.2] stroke-linecap-round" viewBox="0 0 24 24"><path d="M5 11c1.8-4 5.2-4 7 0M12 11c1.8-4 5.2-4 7 0"/><path d="M9 17.5c1.5 2 4.5 2 6 0"/></svg>
                            </button>
                            <!-- 5. 俏皮眨眼 wink (>_o) -->
                            <button data-eye="wink" class="eye-type-btn w-9 h-9 rounded-full bg-[#222226] text-white hover:bg-black transition flex items-center justify-center cursor-pointer p-1.5 hover:scale-105 active:scale-95 shrink-0" title="俏皮眨眼">
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><rect x="14.5" y="5" width="3.8" height="12" rx="1.9"/><path class="stroke-current fill-none stroke-[2.2] stroke-linecap-round stroke-linejoin-round" d="M9 8.5L5 12l4 3.5"/><path class="stroke-current fill-none stroke-[2.2] stroke-linecap-round" d="M11 18.5c1.8 1 4 0.2 5-0.8"/></svg>
                            </button>
                            <!-- 6. 呆萌豆豆 dots (••) -->
                            <button data-eye="dots" class="eye-type-btn w-9 h-9 rounded-full bg-[#222226] text-white hover:bg-black transition flex items-center justify-center cursor-pointer p-1.5 hover:scale-105 active:scale-95 shrink-0" title="呆萌豆豆">
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><circle cx="6.5" cy="12" r="3.5"/><circle cx="17.5" cy="12" r="3.5"/></svg>
                            </button>
                            <!-- 7. 猫咪波浪 cat -->
                            <button data-eye="cat" class="eye-type-btn w-9 h-9 rounded-full bg-[#222226] text-white hover:bg-black transition flex items-center justify-center cursor-pointer p-1.5 hover:scale-105 active:scale-95 shrink-0" title="猫咪波浪">
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><rect x="5.5" y="5" width="3.6" height="10" rx="1.8"/><rect x="14.9" y="5" width="3.6" height="10" rx="1.8"/><path class="stroke-current fill-none stroke-[2.2] stroke-linecap-round" d="M8 17.5c1.2 1.6 2.6 1 3.8 0c1.2 1 2.6 1.6 3.8 0"/></svg>
                            </button>
                            <!-- 8. 八字腮红 shy -->
                            <button data-eye="shy" class="eye-type-btn w-9 h-9 rounded-full bg-[#222226] text-white hover:bg-black transition flex items-center justify-center cursor-pointer p-1.5 hover:scale-105 active:scale-95 shrink-0" title="八字腮红">
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><rect x="5.5" y="5" width="3.6" height="10" rx="1.8" transform="rotate(-15 7.3 10)"/><rect x="14.9" y="5" width="3.6" height="10" rx="1.8" transform="rotate(15 16.7 10)"/><circle cx="4" cy="17" r="1.8" opacity="0.6"/><circle cx="20" cy="17" r="1.8" opacity="0.6"/></svg>
                            </button>
                            <!-- 9. 惊奇圆嘴 surprised -->
                            <button data-eye="surprised" class="eye-type-btn w-9 h-9 rounded-full bg-[#222226] text-white hover:bg-black transition flex items-center justify-center cursor-pointer p-1.5 hover:scale-105 active:scale-95 shrink-0" title="惊奇圆嘴">
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><circle cx="6.5" cy="9.5" r="3.2"/><circle cx="17.5" cy="9.5" r="3.2"/><circle cx="12" cy="17" r="2.4" class="stroke-current fill-none stroke-[2.2]"/></svg>
                            </button>
                            <!-- 10. 悠闲闭眼 flat (--) -->
                            <button data-eye="flat" class="eye-type-btn w-9 h-9 rounded-full bg-[#222226] text-white hover:bg-black transition flex items-center justify-center cursor-pointer p-1.5 hover:scale-105 active:scale-95 shrink-0" title="悠闲闭眼">
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><rect x="4" y="10.5" width="7" height="3" rx="1.5"/><rect x="13" y="10.5" width="7" height="3" rx="1.5"/></svg>
                            </button>
                            <!-- 11. 心动爱心 love (♥♥) -->
                            <button data-eye="love" class="eye-type-btn w-9 h-9 rounded-full bg-[#222226] text-white hover:bg-black transition flex items-center justify-center cursor-pointer p-1.5 hover:scale-105 active:scale-95 shrink-0" title="心动爱心">
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M7 6C5 4.5 2.5 5.8 2.5 8.2c0 2.5 4.5 6 4.5 6s4.5-3.5 4.5-6c0-2.4-2.5-3.7-4.5-2.2zM17 6c-2-1.5-4.5-0.2-4.5 2.2c0 2.5 4.5 6 4.5 6s4.5-3.5 4.5-6c0-2.4-2.5-3.7-4.5-2.2z"/></svg>
                            </button>
                            <!-- 12. 旋转漩涡 dizzy (@@) -->
                            <button data-eye="dizzy" class="eye-type-btn w-9 h-9 rounded-full bg-[#222226] text-white hover:bg-black transition flex items-center justify-center cursor-pointer p-1.5 hover:scale-105 active:scale-95 shrink-0" title="旋转漩涡">
                                <svg class="w-5 h-5 stroke-current fill-none stroke-[2.0] stroke-linecap-round" viewBox="0 0 24 24"><circle cx="6.5" cy="12" r="3.8"/><circle cx="6.5" cy="12" r="1.6"/><circle cx="17.5" cy="12" r="3.8"/><circle cx="17.5" cy="12" r="1.6"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- 眼神定位滑块 (2列无描边胶囊) -->
                    <div class="space-y-1.5">
                        <span class="text-xs font-medium text-[hsla(0,0%,50%,1)]">眼神定位</span>
                        <div class="grid grid-cols-2 gap-2">
                            <div id="pill-eye-y" data-label="垂直高低" data-min="-0.55" data-max="0.55" data-step="0.02" data-value="0.00"></div>
                            <div id="pill-eye-gap" data-label="两眼间距" data-min="0.12" data-max="0.38" data-step="0.01" data-value="0.20"></div>
                            <div id="pill-eye-scale" data-label="眼睛缩放" data-min="0.65" data-max="1.45" data-step="0.05" data-value="1.00" class="col-span-2"></div>
                        </div>
                    </div>

                    <!-- 双色卡通涂装色板 (无描边饱满圆盘) -->
                    <div class="space-y-1.5">
                        <span class="text-xs font-medium text-[hsla(0,0%,50%,1)]">涂装配色</span>
                        <div id="palette-grid" class="flex flex-wrap gap-2.5 items-center"></div>
                    </div>

                    <!-- 顶部附加头饰胶囊 (真实3D效果矢量图形贴图，彻底告别系统Emoji) -->
                    <div class="space-y-1.5">
                        <span class="text-xs font-medium text-[hsla(0,0%,50%,1)]">附加饰品</span>
                        <div id="addon-grid" class="flex flex-wrap gap-2 text-xs"></div>
                    </div>

                </div>

                <!-- 底部操作栏 (移除冗余汉字，保留导出与完成) -->
                <div class="px-6 py-4 flex items-center justify-end gap-3 bg-white border-t border-[hsla(0,0%,0%,0.04)] shrink-0">
                    <button id="btn-export-png" class="h-9 px-5 rounded-full bg-[hsla(0,0%,95%,1)] text-[hsla(0,0%,25%,1)] hover:bg-[hsla(0,0%,90%,1)] text-xs font-medium transition-all duration-150 cursor-pointer flex items-center justify-center select-none active:scale-95 shadow-2xs">导出 PNG</button>
                    <button id="btn-done-sculpt" class="h-9 px-6 rounded-full bg-[hsla(0,0%,18%,1)] hover:bg-black text-white text-xs font-medium transition-all duration-150 cursor-pointer flex items-center justify-center select-none active:scale-95 shadow-xs">完成</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 轻提示 (无描边纯中性胶囊) -->
    <div id="toast-msg" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-50 px-4 py-1.5 rounded-full bg-[hsla(0,0%,25%,0.95)] text-white text-xs shadow-md pointer-events-none opacity-0 transition-opacity duration-200">提示</div>

    <script>
        (function() {
            const isFileProto = window.location.protocol === 'file:';
            const script = document.createElement('script');
            if (isFileProto) {
                script.src = './dist/bundle.js';
            } else {
                script.type = 'module';
                script.src = './src/main.js';
            }
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
