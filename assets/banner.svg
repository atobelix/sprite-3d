<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <!-- 背景渐变与环境光球 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafbfd" />
      <stop offset="50%" stop-color="#f4f5f9" />
      <stop offset="100%" stop-color="#ebedf4" />
    </linearGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- 卡片与元素阴影 -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.03" />
    </filter>

    <filter id="floatShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.09" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 背景点阵 Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#cbd5e1" opacity="0.45" />
    </pattern>

    <!-- 渐变调色板 (对齐工程 2-Tone Cel-Shading 材质) -->
    <!-- 云宝 Nimbus 天蓝 -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#0ea5e9" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- 仙人球 Cacti 翡翠绿 -->
    <linearGradient id="cactiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- 灵感灯泡 Edison 暖橙金 -->
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- 晴雨弯伞 Brolly 胭脂红 -->
    <linearGradient id="brollyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- 折翼 Aero 晨曦橙 -->
    <linearGradient id="aeroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="52%" stop-color="#f97316" />
      <stop offset="52%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- 樱桃纸杯 Muffin 甜粉黄 -->
    <linearGradient id="cupcakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="48%" stop-color="#fde047" />
      <stop offset="48%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="cupcakeBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="1200" height="560" fill="url(#bgGrad)" />
  <rect width="1200" height="560" fill="url(#dotPattern)" />

  <!-- 柔和环境光晕 -->
  <circle cx="980" cy="140" r="280" fill="url(#glowBlue)" />
  <circle cx="1060" cy="420" r="240" fill="url(#glowAmber)" />
  <circle cx="680" cy="300" r="220" fill="url(#glowPurple)" />

  <!-- ======================== 左侧：项目价值与高阶字标 ======================== -->
  <g transform="translate(70, 70)">

    <!-- 顶徽：技术特性小标签 -->
    <g transform="translate(0, 0)">
      <rect width="324" height="30" rx="15" fill="#ffffff" stroke="rgba(0,0,0,0.06)" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" />
      <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600" fill="#475569" letter-spacing="0.5">
        THREE.JS · 179 PROCEDURAL 3D SPRITES
      </text>
    </g>

    <!-- 主标题字标 -->
    <g transform="translate(0, 76)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="62" font-weight="800" fill="#0f172a" letter-spacing="-2.2">
        SPRITE<tspan fill="#3b82f6">.</tspan>3D
      </text>
    </g>

    <!-- 中文副标题 -->
    <g transform="translate(0, 118)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="19" font-weight="700" fill="#1e293b" letter-spacing="0.2">
        原创 3D 卡通精灵图鉴与应用图标工坊
      </text>
    </g>

    <!-- 详细架构阐述 -->
    <g transform="translate(0, 154)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13.5" font-weight="400" fill="#64748b" line-height="1.6">
        <tspan x="0" y="0">基于 Three.js 打造的双色阶跃着色器 · 二阶果冻弹性物理</tspan>
        <tspan x="0" y="24">单 WebGL Canvas 视口裁剪调度 · 1024px 高清透明 PNG 导出</tspan>
      </text>
    </g>

    <!-- 5 大核心功能特性 Chips -->
    <g transform="translate(0, 222)">
      <!-- Chip 1 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="32" rx="8" fill="#ffffff" stroke="rgba(0,0,0,0.06)" />
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#334155">🎨 179 款纯算建模</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(146, 0)">
        <rect width="144" height="32" rx="8" fill="#ffffff" stroke="rgba(0,0,0,0.06)" />
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#334155">⚡ 2-Tone 卡通着色</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(298, 0)">
        <rect width="138" height="32" rx="8" fill="#ffffff" stroke="rgba(0,0,0,0.06)" />
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#334155">💫 二阶果冻物理</text>
      </g>

      <!-- 第二行 Chips -->
      <g transform="translate(0, 42)">
        <rect width="146" height="32" rx="8" fill="#ffffff" stroke="rgba(0,0,0,0.06)" />
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#334155">👀 眼神注视与神态</text>
      </g>
      <g transform="translate(154, 42)">
        <rect width="146" height="32" rx="8" fill="#ffffff" stroke="rgba(0,0,0,0.06)" />
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#334155">📦 1024px PNG 导出</text>
      </g>
      <g transform="translate(308, 42)">
        <rect width="128" height="32" rx="8" fill="#ffffff" stroke="rgba(0,0,0,0.06)" />
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#334155">🗂️ 8 维精选分类</text>
      </g>
    </g>

    <!-- 底部开源项目导航条 -->
    <g transform="translate(0, 334)">
      <rect width="436" height="42" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.07)" filter="url(#cardShadow)" />
      
      <!-- GitHub Octocat 图标 -->
      <path d="M22 21c-4.42 0-8 3.58-8 8 0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0030 29c0-4.42-3.58-8-8-8z" transform="translate(1, -7)" fill="#18181b" />

      <!-- 仓库地址文字 -->
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, monospace" font-size="13" font-weight="600" fill="#18181b">
        github.com/atobelix/sprite-3d
      </text>

      <!-- 右侧 Star 标记 -->
      <g transform="translate(356, 11)">
        <rect width="66" height="20" rx="5" fill="#f1f5f9" />
        <polygon points="12 4 14.5 9 20 9.8 16 13.8 17 19.3 12 16.6 7 19.3 8 13.8 4 9.8 9.5 9" transform="translate(-1, -3) scale(0.85)" fill="#f59e0b" stroke="#d97706" stroke-width="0.8" />
        <text x="22" y="14" font-family="-apple-system, BlinkMacSystemFont, Inter, monospace" font-size="11" font-weight="700" fill="#475569">STAR</text>
      </g>
    </g>
  </g>

  <!-- ======================== 右侧：Bento 风格 3D 萌系精灵卡片矩阵 ======================== -->
  <g transform="translate(560, 50)">

    <!-- ========== 卡片 1：#01 旗舰云宝 Nimbus (居中主位微放大) ========== -->
    <g transform="translate(150, 10)" filter="url(#floatShadow)">
      <rect width="180" height="200" rx="28" fill="#ffffff" stroke="rgba(0,0,0,0.05)" stroke-width="1.5" />
      
      <!-- 精灵体：云宝 Nimbus -->
      <g transform="translate(90, 95)">
        <!-- 投影地盘 -->
        <ellipse cx="0" cy="54" rx="46" ry="11" fill="#0f172a" opacity="0.06" />

        <!-- 云身分层 (3层黄金分割圆润云峰) -->
        <!-- 底座大云层 -->
        <rect x="-48" y="-12" width="96" height="48" rx="24" fill="url(#cloudGrad)" />
        <!-- 左侧中云峰 -->
        <circle cx="-20" cy="-10" r="30" fill="url(#cloudGrad)" />
        <!-- 主顶峰 -->
        <circle cx="12" cy="-22" r="34" fill="url(#cloudGrad)" />
        <!-- 右侧小云峰 -->
        <circle cx="34" cy="-4" r="22" fill="url(#cloudGrad)" />

        <!-- 经典双竖瞳 || (白色高光) -->
        <rect x="-9" y="-6" width="6.5" height="20" rx="3.25" fill="#ffffff" />
        <rect x="7" y="-6" width="6.5" height="20" rx="3.25" fill="#ffffff" />

        <!-- 左上晴空四角星芒金徽 -->
        <g transform="translate(-32, -42) scale(0.95)">
          <path d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.2" />
          <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
        </g>
      </g>

      <!-- 底部名称标签 -->
      <text x="90" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#1e293b">#01 云宝 Nimbus</text>
    </g>

    <!-- ========== 卡片 2：#05 仙人球 Cacti (左侧) ========== -->
    <g transform="translate(0, 40)" filter="url(#cardShadow)">
      <rect width="140" height="160" rx="22" fill="#ffffff" stroke="rgba(0,0,0,0.05)" />
      
      <g transform="translate(70, 75)">
        <ellipse cx="0" cy="42" rx="34" ry="8" fill="#0f172a" opacity="0.05" />
        <!-- 球体主身 -->
        <circle cx="0" cy="0" r="36" fill="url(#cactiGrad)" />
        <!-- 左右小分支肉球 -->
        <circle cx="-28" cy="-4" r="14" fill="url(#cactiGrad)" />
        <circle cx="28" cy="-8" r="15" fill="url(#cactiGrad)" />
        <!-- 头顶金黄花蕾 -->
        <ellipse cx="-4" cy="-36" rx="8" ry="4" fill="#fde047" />
        <ellipse cx="4" cy="-37" rx="7" ry="4" fill="#facc15" />
        <!-- 双瞳 -->
        <rect x="-7" y="-3" width="5.5" height="17" rx="2.75" fill="#ffffff" />
        <rect x="6" y="-3" width="5.5" height="17" rx="2.75" fill="#ffffff" />
      </g>
      <text x="70" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#334155">#05 仙人球 Cacti</text>
    </g>

    <!-- ========== 卡片 3：#13 灵感灯泡 Edison (右侧) ========== -->
    <g transform="translate(345, 40)" filter="url(#cardShadow)">
      <rect width="140" height="160" rx="22" fill="#ffffff" stroke="rgba(0,0,0,0.05)" />
      
      <g transform="translate(70, 72)">
        <ellipse cx="0" cy="45" rx="32" ry="8" fill="#0f172a" opacity="0.05" />
        <!-- 灯泡玻璃体 (圆球 + 下收梯形) -->
        <circle cx="0" cy="-6" r="32" fill="url(#bulbGrad)" />
        <path d="M-18 10 L-12 28 L12 28 L18 10 Z" fill="url(#bulbGrad)" />
        <!-- 螺口底座 (经典深蓝双环) -->
        <rect x="-13" y="28" width="26" height="5" rx="2.5" fill="#2563eb" />
        <rect x="-11" y="34" width="22" height="5" rx="2.5" fill="#1d4ed8" />
        <!-- 灵感四角蓝星芒 -->
        <g transform="translate(-24, -30) scale(0.85)">
          <path d="M0 -13 Q0 0 13 0 Q0 0 0 13 Q0 0 -13 0 Q0 0 0 -13Z" fill="#38bdf8" />
        </g>
        <!-- 双竖瞳 -->
        <rect x="-6" y="-1" width="5" height="16" rx="2.5" fill="#ffffff" />
        <rect x="5" y="-1" width="5" height="16" rx="2.5" fill="#ffffff" />
      </g>
      <text x="70" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#334155">#13 灵感灯泡 Edison</text>
    </g>

    <!-- ========== 卡片 4：#16 晴雨弯伞 Brolly (下排左) ========== -->
    <g transform="translate(0, 220)" filter="url(#cardShadow)">
      <rect width="140" height="160" rx="22" fill="#ffffff" stroke="rgba(0,0,0,0.05)" />
      
      <g transform="translate(70, 75)">
        <ellipse cx="0" cy="45" rx="34" ry="8" fill="#0f172a" opacity="0.05" />
        <!-- 伞顶伞尖金珠 -->
        <circle cx="0" cy="-38" r="4.5" fill="#fbbf24" />
        <rect x="-1.5" y="-34" width="3" height="7" fill="#f59e0b" />
        <!-- 伞面圆顶 (半球截面) -->
        <path d="M-36 -5 A36 34 0 0 1 36 -5 Z" fill="url(#brollyGrad)" />
        <!-- 伞缘黄色卷边环 -->
        <ellipse cx="0" cy="-4" rx="36" ry="7" fill="#fde047" stroke="#eab308" stroke-width="1.5" />
        <!-- 弯弯手柄 -->
        <path d="M0 -4 L0 26 A8 8 0 0 1 -12 34 A4 4 0 0 1 -16 28" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" />
        <!-- 双瞳 -->
        <rect x="-7" y="-18" width="5" height="15" rx="2.5" fill="#ffffff" />
        <rect x="5" y="-18" width="5" height="15" rx="2.5" fill="#ffffff" />
      </g>
      <text x="70" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#334155">#16 晴雨弯伞 Brolly</text>
    </g>

    <!-- ========== 卡片 5：#02 折翼 Aero (下排中) ========== -->
    <g transform="translate(150, 230)" filter="url(#cardShadow)">
      <rect width="180" height="150" rx="24" fill="#ffffff" stroke="rgba(0,0,0,0.05)" />
      
      <g transform="translate(90, 70)">
        <ellipse cx="0" cy="42" rx="42" ry="9" fill="#0f172a" opacity="0.05" />
        <!-- 折纸破风飞机体 -->
        <path d="M-42 22 L0 -38 L42 22 L0 8 Z" fill="url(#aeroGrad)" />
        <path d="M0 -38 L42 22 L0 8 Z" fill="#c2410c" opacity="0.25" />
        <line x1="0" y1="-38" x2="0" y2="8" stroke="#ffffff" stroke-width="1.8" opacity="0.6" />
        <!-- 双瞳 -->
        <rect x="-7" y="-6" width="5" height="15" rx="2.5" fill="#ffffff" />
        <rect x="5" y="-6" width="5" height="15" rx="2.5" fill="#ffffff" />
      </g>
      <text x="90" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#334155">#02 折翼 Aero</text>
    </g>

    <!-- ========== 卡片 6：#33 樱桃纸杯 Muffin (下排右) ========== -->
    <g transform="translate(345, 220)" filter="url(#cardShadow)">
      <rect width="140" height="160" rx="22" fill="#ffffff" stroke="rgba(0,0,0,0.05)" />
      
      <g transform="translate(70, 75)">
        <ellipse cx="0" cy="44" rx="30" ry="8" fill="#0f172a" opacity="0.05" />
        <!-- 下层烘焙纸托 -->
        <path d="M-26 5 L-18 32 L18 32 L26 5 Z" fill="url(#cupcakeBase)" />
        <!-- 上层奶油螺旋顶 -->
        <ellipse cx="0" cy="5" rx="30" ry="14" fill="url(#cupcakeGrad)" />
        <circle cx="0" cy="-6" r="22" fill="url(#cupcakeGrad)" />
        <!-- 顶端鲜艳红樱桃 -->
        <circle cx="0" cy="-26" r="9" fill="#e11d48" />
        <circle cx="-3" cy="-29" r="2.5" fill="#ffffff" opacity="0.8" />
        <path d="M0 -34 Q6 -42 12 -38" fill="none" stroke="#65a30d" stroke-width="2" stroke-linecap="round" />
        <!-- 双竖瞳 -->
        <rect x="-6" y="-8" width="4.5" height="14" rx="2.25" fill="#ffffff" />
        <rect x="4" y="-8" width="4.5" height="14" rx="2.25" fill="#ffffff" />
      </g>
      <text x="70" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#334155">#33 樱桃纸杯 Muffin</text>
    </g>

    <!-- 装饰金星四角星芒 -->
    <g transform="translate(130, -5)" filter="url(#softGlow)">
      <path d="M0 -12 Q0 0 12 0 Q0 0 0 12 Q0 0 -12 0 Q0 0 0 -12Z" fill="#fbbf24" opacity="0.9" />
    </g>
    <g transform="translate(500, 190)" filter="url(#softGlow)">
      <path d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9Z" fill="#38bdf8" opacity="0.8" />
    </g>
    <g transform="translate(-15, 205)" filter="url(#softGlow)">
      <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8Z" fill="#fb7185" opacity="0.8" />
    </g>
  </g>
</svg>
